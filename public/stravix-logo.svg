<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="540" height="120" fill="none">
  <defs>
    <!-- Brushed Silver Gradients with High-Contrast Metallic Sheen -->
    <linearGradient id="silver-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#E2E8F0" />
      <stop offset="70%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <linearGradient id="silver-bottom" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="35%" stop-color="#94A3B8" />
      <stop offset="70%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <linearGradient id="silver-bevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.2" />
    </linearGradient>

    <!-- Vivid Lime Green Accent Gradient (#A3E635) -->
    <linearGradient id="lime-segment" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9F99D" />
      <stop offset="40%" stop-color="#A3E635" />
      <stop offset="100%" stop-color="#65A30D" />
    </linearGradient>

    <!-- Metallic Wordmark Gradient -->
    <linearGradient id="wordmark-silver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#E2E8F0" />
      <stop offset="75%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <filter id="emblem-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- ANGULAR S-SHAPED EMBLEM -->
  <g transform="translate(14, 10)" filter="url(#emblem-glow)">
    <!-- 1. Top Silver Section of the 'S' (Top bar + Upper Left Spine) -->
    <path
      d="M 20 12 L 80 12 L 88 20 L 76 32 L 40 32 L 34 38 L 14 44 L 14 20 Z"
      fill="url(#silver-top)"
    />
    <!-- Top Chamfer Bevel Ridge -->
    <path
      d="M 20 12 L 80 12 L 74 16 L 26 16 Z"
      fill="url(#silver-bevel)"
    />
    <!-- Left Spine Facet Highlight -->
    <path
      d="M 14 20 L 20 12 L 20 42 L 14 44 Z"
      fill="url(#silver-bevel)"
      opacity="0.6"
    />

    <!-- 2. Vivid Lime-Green Dynamic Central Segment (#A3E635) -->
    <polygon
      points="14,46 34,40 86,54 66,60"
      fill="url(#lime-segment)"
    />
    <!-- Lime Specular Highlight Edge -->
    <polygon
      points="14,46 34,40 50,44 30,50"
      fill="#F7FEE7"
      opacity="0.9"
    />

    <!-- 3. Bottom Silver Section of the 'S' (Lower Right Spine + Bottom Bar) -->
    <path
      d="M 80 88 L 20 88 L 12 80 L 24 68 L 60 68 L 66 62 L 86 56 L 86 80 Z"
      fill="url(#silver-bottom)"
    />
    <!-- Bottom Rim Bevel Ridge -->
    <path
      d="M 80 88 L 20 88 L 26 84 L 74 84 Z"
      fill="url(#silver-bevel)"
    />
    <!-- Right Spine Facet Highlight -->
    <path
      d="M 86 80 L 80 88 L 80 58 L 86 56 Z"
      fill="url(#silver-bevel)"
      opacity="0.6"
    />
  </g>

  <!-- TYPOGRAPHY: STRAVIX TECH + BUILDING WHAT'S NEXT -->
  <g transform="translate(136, 18)">
    <!-- STRAVIX (Metallic Brushed Silver) -->
    <text
      x="0"
      y="48"
      font-family="'Space Grotesk', -apple-system, sans-serif"
      font-size="44"
      font-weight="800"
      letter-spacing="3"
      fill="url(#wordmark-silver)"
    >
      STRAVIX
    </text>

    <!-- TECH (Vivid Lime Accent Badge) -->
    <g transform="translate(236, 14)">
      <rect x="0" y="4" width="76" height="34" rx="6" fill="#0B0F14" stroke="#A3E635" stroke-width="1.5" />
      <text
        x="38"
        y="27"
        font-family="'Space Grotesk', -apple-system, sans-serif"
        font-size="20"
        font-weight="700"
        letter-spacing="2"
        fill="#A3E635"
        text-anchor="middle"
      >
        TECH
      </text>
    </g>

    <!-- Hairline Divider -->
    <line x1="2" y1="64" x2="330" y2="64" stroke="#1F2937" stroke-width="1" />
    <line x1="2" y1="64" x2="70" y2="64" stroke="#A3E635" stroke-width="2" />

    <!-- Tagline: BUILDING WHAT'S NEXT -->
    <text
      x="2"
      y="82"
      font-family="'JetBrains Mono', monospace"
      font-size="11.5"
      font-weight="600"
      letter-spacing="5"
      fill="#94A3B8"
    >
      BUILDING WHAT&apos;S NEXT
    </text>
  </g>
</svg>
